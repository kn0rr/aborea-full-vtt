<div class="aborea-attack-dialog-body">

  <div class="form-group">
    <label>Waffe</label>
    <select name="weaponId">
      {{#each weapons}}
      <option value="{{id}}">{{name}} (+{{damage}} Schaden{{#if skill}}, {{skill}}{{/if}})</option>
      {{/each}}
    </select>
  </div>

  <div class="form-group untrained-row" {{#unless initialPenalty}}style="display:none"{{/unless}}>
    <label>Ungelernt <span class="hint">(Waffenfertigkeit Rang 0)</span></label>
    <span class="untrained-display">−2</span>
  </div>

  <div class="form-group">
    <label>Offensivbonus <span class="hint">(Kampfbonus: {{combatBonus}})</span></label>
    <input type="number" name="offBonus" value="{{currentOffBonus}}" min="-20" max="{{combatBonus}}" />
  </div>

  <div class="form-group">
    <label>Situationsmodifikator <span class="hint">(negativ = Erschwernis)</span></label>
    <input type="number" name="situMod" value="{{globalSituMod}}" />
  </div>

  <div class="form-group">
    <label>Ziel</label>
    <select name="targetTokenId">
      <option value="">— Kein Ziel (VW manuell) —</option>
      {{#each targetCandidates}}
      <option value="{{id}}" {{#if preselected}}selected{{/if}}>{{name}} · RW {{dv}} · HP {{hp}}</option>
      {{/each}}
    </select>
  </div>

  <div class="target-preview" style="display:none">
    <img class="target-preview-img" src="" alt="" />
    <div class="target-preview-info">
      <span class="target-preview-name"></span>
      <div class="hp-bar-wrap target-preview-hp-bar">
        <div class="hp-bar-fill target-preview-hp-fill" style="width:100%"></div>
      </div>
      <span class="target-preview-stats"></span>
    </div>
  </div>

  <div class="form-group manual-dv-row">
    <label>Verteidigungswert <span class="hint">(manuell)</span></label>
    <input type="number" name="manualDefense" value="5" min="1" />
  </div>

  <footer class="sheet-footer dialog-footer">
    <button type="submit" class="bright">
      <i class="fas fa-dice-d10"></i> Angreifen
    </button>
    <button type="button" class="dialog-cancel-btn">Abbruch</button>
  </footer>

</div>
