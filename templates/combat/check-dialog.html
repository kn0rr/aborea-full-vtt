<div class="aborea-check-form">
  <div class="form-group">
    <label>Probe auf</label>
    <select id="check-type-select">
      <optgroup label="Attribute">
        {{#each attrs as |attr|}}
        <option value="attr::{{attr.key}}">{{attr.label}}</option>
        {{/each}}
      </optgroup>
      <optgroup label="Fertigkeiten">
        {{#each skills as |skill|}}
        <option value="{{skill.type}}::{{skill.key}}">{{skill.label}}{{#if skill.rank}} (Rang {{skill.rank}}){{/if}}</option>
        {{/each}}
      </optgroup>
    </select>
    <input type="hidden" name="checkType" id="check-type-hidden" value="attr" />
    <input type="hidden" name="checkKey"  id="check-key-hidden"  value="st" />
  </div>

  <div class="form-group">
    <label>Schwierigkeit</label>
    <div class="check-difficulty-row">
      <select id="check-difficulty-select">
        {{#each difficulties as |d|}}
        <option value="{{d.val}}" {{#if (aboreaEq d.val 10)}}selected{{/if}}>{{d.label}}</option>
        {{/each}}
        <option value="0">Eigener Wert …</option>
      </select>
      <input type="number" name="difficulty" id="check-difficulty-input" value="10" min="1" max="30" style="width:60px" />
    </div>
  </div>

  <div class="form-group">
    <label title="Positiv = Erleichterung, Negativ = Erschwernis">Situationsmodifikator</label>
    <input type="number" name="situMod" value="0" min="-10" max="10" />
  </div>

  <footer class="form-footer">
    <button type="submit" class="btn-primary">🎲 Würfeln</button>
  </footer>
</div>
